<otpv-header selectedOption="caja"
             [appName]="appName()" />

<main class="cash-register">
    <section class="cash-register__panel">
        <header class="cash-register__toolbar">
            <h1>
                CAJA
            </h1>
        </header>

        <nav class="cash-register__tabs"
             role="tablist"
             aria-label="Apartados de Caja">
            @for (section of sections; track section.id) {
            <button class="cash-register__tab"
                    type="button"
                    role="tab"
                    [class.cash-register__tab--active]="activeSection() === section.id"
                    [attr.aria-selected]="activeSection() === section.id"
                    (click)="selectSection(section.id)">
                {{ section.label }}
            </button>
            }
        </nav>

        <div class="cash-register__content">
            @switch (activeSection()) {
            @case ('history') {
            <otpv-historical-sales [embedded]="true" />
            }

            @case ('outflows') {
            <otpv-cash-outflows />
            }

            @case ('closing') {
            <otpv-cash-closing />
            }

            @case ('reports') {
            <section class="cash-register__placeholder">
                <h2>
                    Informes
                </h2>

                <p>
                    Este apartado se definirá más adelante.
                </p>
            </section>
            }
            }
        </div>
    </section>
</main>
