@if (mode() === null) {
<main class="setup-choice">
    <section class="setup-choice__header">
        <p class="setup-choice__eyebrow">
            Bienvenido a Osumi TPV
        </p>

        <h1>
            ¿Cómo quieres empezar?
        </h1>

        <p class="setup-choice__description">
            Puedes configurar una instalación vacía
            o recuperar toda la información de una
            instalación anterior de Osumi TPV.
        </p>
    </section>

    <section class="setup-choice__options"
             aria-label="Opciones de instalación">
        <button type="button"
                class="setup-option"
                (click)="selectNewInstallation()">
            <span class="setup-option__icon"
                  aria-hidden="true">
                +
            </span>

            <span class="setup-option__content">
                <strong>
                    Configurar una nueva instalación
                </strong>

                <span>
                    Introduce los datos del negocio,
                    crea el primer empleado y configura
                    los valores iniciales de caja.
                </span>
            </span>

            <span class="setup-option__arrow"
                  aria-hidden="true">
                →
            </span>
        </button>

        <button type="button"
                class="setup-option"
                (click)="selectLegacyImport()">
            <span class="setup-option__icon"
                  aria-hidden="true">
                ↥
            </span>

            <span class="setup-option__content">
                <strong>
                    Importar Osumi TPV anterior
                </strong>

                <span>
                    Selecciona un paquete .otpv para
                    recuperar artículos, ventas,
                    clientes, compras y configuración.
                </span>
            </span>

            <span class="setup-option__arrow"
                  aria-hidden="true">
                →
            </span>
        </button>
    </section>
</main>
}
@else {
<section class="setup-flow">
    <header class="setup-flow__header">
        <button type="button"
                matButton="filled"
                (click)="returnToModeSelection()">
            <mat-icon>arrow_back</mat-icon>
            Cambiar opción
        </button>
    </header>

    @switch (mode()) {
    @case ('new-installation') {
    <otpv-new-installation />
    }

    @case ('legacy-import') {
    <otpv-legacy-import />
    }
    }
</section>
}
