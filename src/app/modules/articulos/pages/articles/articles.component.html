<otpv-header selectedOption="articulos"
             [appName]="appName()" />

<main class="articles">
    <otpv-articles-tabs [tabs]="articulosService.tabs()"
                        [selectedId]="articulosService.activeTabId()"
                        (selectTabEvent)="selectArticle($event)"
                        (closeTabEvent)="closeArticle($event)"
                        (newTabEvent)="newArticle()" />

    @if (articulosService.activeTab(); as tab) {
    <section class="articles__workspace">
        <otpv-article-workspace [tab]="tab"
                                [searching]="searching()"
                                [processing]="isProcessing(tab.idTemporal)"
                                [saveSuccessful]="savedTabId() === tab.idTemporal"
                                (resolveCodeEvent)="resolveArticleCode($event, tab.idTemporal)"
                                (searchEvent)="openSearch($event, tab.idTemporal)"
                                (draftChangeEvent)="updateArticleDraft($event)"
                                (sectionChangeEvent)="selectArticleSection($event)"
                                (saveEvent)="saveArticle($event)"
                                (cancelEvent)="cancelArticle($event)"
                                (duplicateEvent)="duplicateArticle($event)"
                                (deactivateEvent)="deactivateArticle($event)" />
    </section>
    } @else {
    <section class="articles__state">
        <h2>
            No hay ningún artículo abierto
        </h2>

        <p>
            Abre un artículo existente o crea una nueva ficha.
        </p>

        <div class="articles__state-actions">
            <button mat-stroked-button
                    type="button"
                    (click)="openSearch()">
                Buscar artículo
            </button>

            <button mat-flat-button
                    type="button"
                    (click)="newArticle()">
                Nuevo artículo
            </button>
        </div>
    </section>
    }
</main>

@if (searchOpen()) {
<otpv-article-search context="articulos"
                     [initialQuery]="searchInitialQuery()"
                     (selectEvent)="openSearchSelection($event)"
                     (closeEvent)="closeSearch()" />
}
