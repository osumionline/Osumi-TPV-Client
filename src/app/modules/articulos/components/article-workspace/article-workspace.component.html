<section class="article-workspace">
    <header class="article-workspace__header">
        <label class="article-workspace__field article-workspace__field--locator">
            <span class="article-workspace__label">
                Localizador
            </span>

            <div class="article-workspace__locator">
                <div class="article-workspace__lookup">
                    <input #localizadorInput
                           type="text"
                           autocomplete="off"
                           [disabled]="searching()"
                           [value]="tab().draft.localizador ?? ''"
                           [placeholder]="
                             tab().draft.localizador === null
                               ? 'Automático al guardar'
                               : ''
                           "
                           (focus)="onLocalizadorFocus($event)"
                           (keydown)="onLocalizadorKeydown($event)">

                    <button type="button"
                            matTooltip="Buscar artículo"
                            (click)="openSearch()">
                        <mat-icon>search</mat-icon>
                    </button>
                </div>

                <button type="button"
                        class="article-workspace__direct-access"
                        matTooltip="Gestionar accesos directos"
                        (click)="openDirectAccesses()">
                    <mat-icon>dialpad</mat-icon>
                </button>
            </div>
        </label>

        <label class="article-workspace__field article-workspace__field--name">
            <span class="article-workspace__label">
                Nombre
            </span>

            <input type="text"
                   autocomplete="off"
                   [value]="tab().draft.nombre"
                   (input)="onNameInput($event)">
        </label>
    </header>

    <otpv-article-section-tabs [tab]="tab()"
                               (selectSectionEvent)="selectSection($event)" />

    <div class="article-workspace__body">
        @switch (tab().activeSection) {
        @case ('general') {
        <otpv-article-general [tab]="tab()"
                              (draftChangeEvent)="emitDraftChange($event)" />
        }

        @case ('web') {
        <otpv-article-web [tab]="tab()"
                          (draftChangeEvent)="emitDraftChange($event)" />
        }

        @case ('barcodes') {
        <otpv-article-barcodes [tab]="tab()"
                               (draftChangeEvent)="emitDraftChange($event)" />
        }

        @case ('history') {
        <otpv-article-history [tab]="tab()" />
        }

        @case ('notes') {
        <otpv-article-notes [tab]="tab()"
                            (draftChangeEvent)="emitDraftChange($event)" />
        }

        @default {
        <div class="article-workspace__pending">
            Este apartado se implementará en su siguiente bloque.
        </div>
        }
        }
    </div>

    <footer class="article-workspace__actions">
        @if (saveSuccessful()) {
        <span class="article-workspace__save-feedback"
              role="status"
              aria-live="polite">
            Artículo guardado correctamente
        </span>
        }

        <button mat-stroked-button
                type="button"
                [disabled]="!tab().dirty || processing()"
                (click)="cancel()">
            Cancelar
        </button>

        <button mat-flat-button
                type="button"
                [disabled]="!tab().dirty || processing()"
                (click)="save()">
            @if (processing()) {
            Guardando…
            } @else {
            Guardar
            }
        </button>
    </footer>
</section>

@if (directAccessOpen()) {
<otpv-article-direct-accesses [tab]="tab()"
                              (closeEvent)="closeDirectAccesses()" />
}
