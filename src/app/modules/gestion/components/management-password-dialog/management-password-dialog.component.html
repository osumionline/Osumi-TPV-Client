<h2 mat-dialog-title>
    Acceso a Gestión
</h2>

<mat-dialog-content class="management-password-dialog">
    <p class="management-password-dialog__description">
        Introduce la contraseña de
        <strong>{{ empleado.nombre }}</strong>.
    </p>

    <form id="management-password-form"
          (ngSubmit)="authenticate()">
        <mat-form-field class="management-password-dialog__field">
            <mat-label>
                Contraseña
            </mat-label>

            <input matInput
                   class="management-password-dialog__password"
                   type="password"
                   autocomplete="current-password"
                   [formControl]="passwordControl">
        </mat-form-field>
    </form>

    @if (error(); as errorMessage) {
    <p class="management-password-dialog__error"
       role="alert">
        {{ errorMessage }}
    </p>
    }
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button
            type="button"
            [mat-dialog-close]="false">
        {{ authenticationUnavailable() ? 'Cerrar' : 'Cancelar' }}
    </button>

    @if (!authenticationUnavailable()) {
    <button mat-flat-button
            type="submit"
            form="management-password-form"
            [disabled]="loading()">
        {{ loading() ? 'Comprobando…' : 'Entrar' }}
    </button>
    }
</mat-dialog-actions>
