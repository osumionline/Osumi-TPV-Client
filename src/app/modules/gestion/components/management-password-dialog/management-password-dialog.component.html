<div class="overlay overlay--dimmed quick-create-overlay">
    <section class="quick-create management-password-modal overlay__panel"
             role="dialog"
             aria-modal="true"
             aria-labelledby="management-password-title">

        <header class="quick-create__header">
            <h2 id="management-password-title">
                Acceso a Gestión
            </h2>

            <button type="button"
                    class="quick-create__close"
                    aria-label="Cerrar"
                    [disabled]="loading()"
                    (click)="close()">
                <mat-icon>
                    close
                </mat-icon>
            </button>
        </header>

        <form class="quick-create__form"
              (submit)="submit($event)">

            <div class="quick-create__body">
                <p class="management-password-modal__description">
                    Introduce la contraseña de
                    <strong>{{ empleado().nombre }}</strong>.
                </p>

                <label class="quick-create__field">
                    <span>
                        Contraseña
                    </span>

                    <input #passwordInput
                           class="otpv-control"
                           type="password"
                           autocomplete="current-password"
                           [value]="password()"
                           [disabled]="loading() || authenticationUnavailable()"
                           (input)="updatePassword($event)">
                </label>

                @if (error() !== null) {
                <p class="quick-create__error"
                   role="alert">
                    {{ error() }}
                </p>
                }
            </div>

            <footer class="quick-create__actions">
                <button mat-stroked-button
                        type="button"
                        [disabled]="loading()"
                        (click)="close()">
                    {{ authenticationUnavailable() ? 'Cerrar' : 'Cancelar' }}
                </button>

                @if (!authenticationUnavailable()) {
                <button mat-flat-button
                        type="submit"
                        [disabled]="loading()">
                    {{ loading() ? 'Comprobando…' : 'Entrar' }}
                </button>
                }
            </footer>
        </form>
    </section>
</div>
