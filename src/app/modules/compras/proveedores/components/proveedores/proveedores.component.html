<section class="suppliers">
    @if (proveedoresService.workspace(); as workspace) {
    <otpv-proveedor-section-tabs [workspace]="workspace"
                                 [disabled]="proveedoresService.processing()"
                                 (selectSectionEvent)="selectSection($event)" />

    <div class="suppliers__workspace">
        @switch (workspace.activeSection) {
        @case ('data') {
        <otpv-proveedor-form [initialValue]="workspace.draft"
                             [dirty]="proveedoresService.dirty()"
                             [saving]="proveedoresService.saving()"
                             [processing]="proveedoresService.processing()"
                             [deactivating]="proveedoresService.deactivating()"
                             [canDelete]="workspace.proveedorId !== null"
                             [saveSuccessful]="saveSuccessful()"
                             [focusNameRequest]="proveedoresService.focusNameRequest()"
                             (modelChangeEvent)="updateDraft($event)"
                             (logoSelectedEvent)="selectLogo($event)"
                             (logoRemoveEvent)="removeLogo()"
                             (saveEvent)="saveProveedor($event)"
                             (cancelEvent)="cancelChanges()"
                             (deleteEvent)="deleteProveedor()" />
        }

        @case ('brands') {
        <otpv-proveedor-marcas [marcas]="marcasService.marcas()"
                               [selectedIds]="workspace.draft.marcas"
                               [dirty]="proveedoresService.dirty()"
                               [saving]="proveedoresService.saving()"
                               [processing]="proveedoresService.processing()"
                               [saveSuccessful]="saveSuccessful()"
                               (selectionChangeEvent)="updateMarcas($event)"
                               (saveEvent)="saveMarcas()"
                               (cancelEvent)="cancelChanges()" />
        }

        @case ('commercials') {
        <otpv-proveedor-comerciales [comerciales]="proveedoresService.workspaceProveedor()?.comerciales ?? []"
                                    [workspace]="workspace.comercialWorkspace"
                                    [dirty]="proveedoresService.comercialDirty()"
                                    [saving]="proveedoresService.comercialSaving()"
                                    [processing]="proveedoresService.processing()"
                                    [deactivating]="proveedoresService.comercialDeactivating()"
                                    [saveSuccessful]="commercialSaveSuccessful()"
                                    (newEvent)="newComercial()"
                                    (selectEvent)="selectComercial($event)"
                                    (modelChangeEvent)="updateComercialDraft($event)"
                                    (saveEvent)="saveComercial($event)"
                                    (cancelEvent)="cancelComercial()"
                                    (deleteEvent)="deleteComercial()" />
        }
        }
    </div>
    }
    @else {
    <div class="suppliers__state">
        <h2>
            PROVEEDORES
        </h2>

        <p>
            Busca un proveedor existente o crea uno nuevo.
        </p>
    </div>
    }
</section>
