<section class="brands">
    @if (marcasService.workspace(); as workspace) {
    <otpv-marca-section-tabs [workspace]="workspace"
                             (selectSectionEvent)="selectSection($event)"
                             [disabled]="marcasService.processing()" />

    <div class="brands__workspace">
        @switch (workspace.activeSection) {
        @case ('data') {
        <otpv-marca-form [initialValue]="workspace.draft"
                         [dirty]="marcasService.dirty()"
                         [saving]="marcasService.saving()"
                         [processing]="marcasService.processing()"
                         [deactivating]="marcasService.deactivating()"
                         [canDelete]="workspace.marcaId !== null"
                         [saveSuccessful]="saveSuccessful()"
                         [focusNameRequest]="marcasService.focusNameRequest()"
                         (modelChangeEvent)="updateDraft($event)"
                         (logoSelectedEvent)="selectLogo($event)"
                         (logoRemoveEvent)="removeLogo()"
                         (saveEvent)="saveMarca($event)"
                         (cancelEvent)="cancelChanges()"
                         (deleteEvent)="deleteMarca()" />
        }

        @case ('statistics') {
        <section class="brands__section-state">
            <h3>
                Estadísticas
            </h3>

            <p>
                Las estadísticas de la marca se incorporarán más adelante.
            </p>
        </section>
        }
        }
    </div>
    }
    @else {
    <div class="brands__state">
        <p>
            Elige una marca de la lista.
        </p>
    </div>
    }
</section>
