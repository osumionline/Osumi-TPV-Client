<div class="brand-actions">
    @if (marcasService.workspace(); as workspace) {
    <strong class="brand-actions__name">
        {{ workspace.draft.nombre || 'Nueva marca' }}
    </strong>

    <button mat-icon-button
            type="button"
            matTooltip="Cerrar ficha"
            aria-label="Cerrar ficha de marca"
            [disabled]="marcasService.processing()"
            (click)="closeMarca()">
        <mat-icon>
            close
        </mat-icon>
    </button>
    }

    <button mat-icon-button
            type="button"
            matTooltip="Buscar marca"
            aria-label="Buscar marca"
            [disabled]="marcasService.processing()"
            (click)="openSearch()">
        <mat-icon>
            search
        </mat-icon>
    </button>

    <button mat-icon-button
            type="button"
            matTooltip="Nueva marca"
            aria-label="Crear una marca nueva"
            [disabled]="marcasService.processing()"
            (click)="newMarca()">
        <mat-icon>
            add
        </mat-icon>
    </button>
</div>

@if (searchOpen()) {
<otpv-marca-search [marcas]="marcasService.marcas()"
                   [selectedPublicId]="
                       marcasService.workspace()?.marcaPublicId ?? null
                   "
                   (selectEvent)="selectMarca($event)"
                   (cancelEvent)="closeSearch()" />
}
