<div class="overlay">
    <button class="overlay__backdrop"
            type="button"
            aria-label="Cerrar buscador de marcas"
            (click)="cancel()">
    </button>

    <section class="brand-search overlay__panel"
             role="dialog"
             aria-modal="true"
             aria-labelledby="brand-search-title"
             (keydown.escape)="cancel()">
        <header class="brand-search__header">
            <h2 id="brand-search-title">
                Marcas
            </h2>

            <button mat-icon-button
                    type="button"
                    aria-label="Cerrar buscador de marcas"
                    (click)="cancel()">
                <mat-icon>
                    close
                </mat-icon>
            </button>
        </header>

        <div class="brand-search__search">
            <input #searchInput
                   class="otpv-control"
                   type="search"
                   autocomplete="off"
                   placeholder="Introduce el nombre a buscar"
                   [value]="query()"
                   (input)="updateQuery($event)">
        </div>

        <div class="brand-search__results">
            @for (marca of filteredMarcas(); track marca.publicId) {
            <button class="brand-search__card"
                    type="button"
                    [class.brand-search__card--selected]="
                        selectedPublicId() === marca.publicId
                    "
                    (click)="select(marca)">
                @if (marca.foto !== null) {
                <span class="brand-search__image">
                    <img [src]="marca.foto"
                         [attr.alt]="'Logo de ' + marca.nombre"
                         loading="lazy">
                </span>
                }

                <span class="brand-search__name">
                    {{ marca.nombre }}
                </span>
            </button>
            }
            @empty {
            <div class="brand-search__empty">
                No se han encontrado marcas.
            </div>
            }
        </div>
    </section>
</div>
