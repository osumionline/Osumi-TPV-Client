<otpv-header selectedOption="compras"
             [appName]="appName()" />

<main class="purchases">
    <section class="purchases__panel">
        <header class="purchases__toolbar">
            <h1>
                COMPRAS
            </h1>
        </header>

        <otpv-purchases-tabs [activeSection]="activeSection()"
                             (selectSectionEvent)="selectSection($event)">
            @switch (activeSection()) {
            @case ('brands') {
            <otpv-marca-toolbar-actions />
            }
            }
        </otpv-purchases-tabs>


        <div class="purchases__content">
            @switch (activeSection()) {
            @case ('orders') {
            <otpv-pedidos />
            }
            @case ('brands') {
            <otpv-marcas />
            }
            @case ('suppliers') {
            <section class="purchases__state">
                <h2>PROVEEDORES</h2>
                <p>
                    La gestión de proveedores se incorporará después de completar Pedidos.
                </p>
            </section>
            }
            }
        </div>
    </section>
</main>
