<div class="employee-selector"
     [class.overlay]="!embedded()"
     [class.overlay--dimmed]="!embedded()"
     [class.employee-selector--embedded]="embedded()">
    <section class="selector"
             [class.overlay__panel]="!embedded()"
             [class.selector--embedded]="embedded()"
             [attr.role]="embedded() ? null : 'dialog'"
             [attr.aria-modal]="embedded() ? null : 'true'"
             aria-labelledby="employee-selector-title">
        <h2 id="employee-selector-title">
            Seleccionar empleado
        </h2>

        <p class="selector__description">
            Selecciona quién atenderá esta venta.
        </p>

        <div class="selector__employees">
            @for (empleado of empleados(); track empleado.publicId) {
            <button class="selector__employee"
                    type="button"
                    [style.background-color]="empleado.color"
                    [style.color]="empleado.textColor"
                    (click)="select(empleado)">
                {{ empleado.nombre }}
            </button>
            }
        </div>

        @if (!embedded()) {
        <div class="selector__actions">
            <button mat-stroked-button
                    type="button"
                    (click)="cancel()">
                Cancelar
            </button>
        </div>
        }
    </section>
</div>
